<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG de Cafetería con Patita de Gato</title>

</head>
<body>

<!-- SVG de una taza de café con huella de gato -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Plato -->
    <ellipse cx="100" cy="170" rx="70" ry="15" fill="#d9c3a3" />
    
    <!-- Cuerpo de la taza -->
    <rect x="50" y="60" width="100" height="80" rx="15" ry="15" fill="#ffffff" stroke="#8b5e3c" stroke-width="4"/>
    
    <!-- Asa -->
    <path d="M150 80 Q170 100 150 120" fill="none" stroke="#8b5e3c" stroke-width="6"/>
    
    <!-- Café -->
    <ellipse cx="100" cy="60" rx="48" ry="10" fill="#6f4e37" />
    
    <!-- Vapor -->
    <path d="M80 40 C75 20, 85 10, 80 -5" stroke="#cccccc" stroke-width="3" fill="none"/>
    <path d="M100 40 C95 20, 105 10, 100 -5" stroke="#cccccc" stroke-width="3" fill="none"/>
    <path d="M120 40 C115 20, 125 10, 120 -5" stroke="#cccccc" stroke-width="3" fill="none"/>
    
    <!-- Huella de gato en el centro -->
    <!-- Almohadilla central -->
    <circle cx="100" cy="100" r="12" fill="#8b5e3c"/>
    <!-- Dedos -->
    <circle cx="85" cy="85" r="6" fill="#8b5e3c"/>
    <circle cx="115" cy="85" r="6" fill="#8b5e3c"/>
    <circle cx="90" cy="75" r="6" fill="#8b5e3c"/>
    <circle cx="110" cy="75" r="6" fill="#8b5e3c"/>
</svg>

</body>
</html>
